<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR cây nhị phân - MindAR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Ảnh màu sẽ hiện ra khi quét ảnh đích (file mau.png cùng thư mục) -->
      <img id="mau" src="./mau.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex 0 = ảnh đích duy nhất trong targets.mind (ảnh cây 1-6 đen trắng).
         Ảnh đích rộng 1 đơn vị; ảnh màu 604x615 nên cao 615/604 ≈ 1.018. -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-image src="#mau" width="1" height="1.018" position="0 0 0.01"></a-image>
    </a-entity>
  </a-scene>
</body>
</html>
